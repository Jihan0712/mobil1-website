<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobil - Driver Profile</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/driver-profile.css">
    <link rel="stylesheet" href="css/homepage.css">
    <link rel="stylesheet" href="css/chat-window.css">
</head>
<body>

    <div class="chat-bot" onclick="toggleChat()"></div>

    <header>
        <div class="logo-container">
            <a href="homepage.html">
                <img src="https://via.placeholder.com/100x40/ffffff/001f5b?text=Mobil" alt="Mobil Logo">
            </a>
            <span class="logo-divider">|</span>
            <img src="https://via.placeholder.com/120x40/ffffff/001f5b?text=Allied+Lubrication" alt="Allied Lubrication">
        </div>
        
        <div class="menu-toggle">
            <svg width="24" height="24" viewBox="120 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M124 7H140M124 12H140M124 17H140" stroke="#001450" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        
        <nav class="desktop-nav">
            <ul>
                <li><a href="#">Products &#709;</a></li>
                <li><a href="#">Where to Buy</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
        <div class="desktop-actions">
            <button class="btn-primary">Find the Right Oil &#8594;</button>
            
            <a href="search.html" style="cursor: pointer; display: flex;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10.5 17C14.0899 17 17 14.0899 17 10.5C17 6.91015 14.0899 4 10.5 4C6.91015 4 4 6.91015 4 10.5C4 14.0899 6.91015 17 10.5 17Z" stroke="#001450" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M15.5 15.5L21 21" stroke="#001450" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>
        </div>
    </header>

    <main class="driver-profile-section">
        
        <div class="image-column">
            <img src="https://via.placeholder.com/600x650/cccccc/333333?text=Yellow+Sports+Car" alt="Yellow Porsche">
        </div>

        <div class="text-column">
            <span class="eyebrow-text">Driver Profile</span>
            <h1>Which driver are you?</h1>
            <p>Answer five quick questions about your vehicle, driving conditions, and maintenance priorities. We'll identify your driver profile and narrow down the protection that fits your standards.</p>
            
            <button class="btn-primary">Let's start &#8594;</button>
        </div>

    </main>


    <script src="../js files/migs-bot.js"></script>
    <script src="../js files/components.js"></script>
